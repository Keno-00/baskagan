[package]
name = "dado-sde"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", default-features = false }
dioxus = { version = "0.7", features = ["desktop"] }
rfd = "0.17"
tokio = { version = "1", features = ["rt", "time"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tempfile = "3"
open = "5"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
serde_yaml_ng = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Storage_FileSystem"] }
